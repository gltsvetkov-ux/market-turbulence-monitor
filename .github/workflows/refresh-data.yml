name: Refresh MTM market snapshot
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 7,13,19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check yfinance pandas numpy
      - run: python -m py_compile scripts/refresh_data.py scripts/prospective_validation.py tests/test_risk_model.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh_data.py
      - run: python scripts/prospective_validation.py
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json, datetime, math
          d=json.load(open('data.json'))
          for k in ('ES','NQ'):
              m=d['markets'][k]
              h=m['history']
              assert len(h)>=250, (k,'short history')
              assert all(math.isfinite(float(x['close'])) and x['close']>0 for x in h)
              dates=[x['date'] for x in h]
              assert dates==sorted(set(dates)),(k,'duplicate or unordered dates')
              assert dates[-1]==m['asof']
              assert m['risk_model']['signal_eligible'] is False
              assert m['risk_model']['signal']=='disabled_unvalidated'
              assert m['data_quality']['roll_adjustment_verified'] is False
              age=(datetime.date.today()-datetime.date.fromisoformat(m['asof'])).days
              assert 0<=age<=5,(k,'stale market data',age)
          print('Validated ES/NQ snapshots; risk signals disabled pending independent validation')
          PY
      - name: Commit snapshot only if changed
        run: |
          git config user.name "mtm-data-bot"
          git config user.email "mtm-data-bot@users.noreply.github.com"
          git add data.json prospective_forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ES NQ public market snapshot"
            git push
          fi
