name: Refresh MTM market snapshot
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 7,13,19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check yfinance pandas numpy
      - run: python scripts/refresh_data.py
      - name: Commit snapshot only if changed
        run: |
          git config user.name "mtm-data-bot"
          git config user.email "mtm-data-bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ES NQ public market snapshot"
            git push
          fi
